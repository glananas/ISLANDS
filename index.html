<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"
    />
    <meta name="theme-color" content="#0a2138" />
    <meta name="color-scheme" content="dark" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="format-detection" content="telephone=no" />
    <title>Islands — строй, развивай, открывай</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
      html,
      body {
        margin: 0;
        padding: 0;
        height: 100%;
        background: #0a2138;
        overflow: hidden;
        -webkit-text-size-adjust: 100%;
        font-family: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
        color: #f2fbff;
      }
      #root {
        height: 100%;
      }
      #boot-splash {
        position: fixed;
        inset: 0;
        z-index: 999;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 18px;
        background:
          radial-gradient(120% 80% at 50% 20%, #2c8fb4 0%, #14668c 45%, #082a44 100%);
        transition: opacity 0.45s ease;
      }
      #boot-splash.is-hidden {
        opacity: 0;
        pointer-events: none;
      }
      .boot-logo {
        font-size: 46px;
        font-weight: 800;
        letter-spacing: -1px;
        color: #f6fdff;
        text-shadow: 0 6px 30px rgba(0, 38, 61, 0.45);
        display: flex;
        align-items: center;
        gap: 10px;
      }
      .boot-palm {
        font-size: 34px;
        transform: translateY(-8px);
      }
      .boot-sub {
        margin-top: -10px;
        color: #c7f2f4;
        letter-spacing: 4px;
        font-size: 10px;
        text-transform: uppercase;
      }
      .boot-wave {
        width: 130px;
        height: 26px;
        border-radius: 50%;
        border-bottom: 2px solid rgba(255, 255, 255, 0.55);
        animation: bootPulse 1.4s ease-in-out infinite;
      }
      .boot-error {
        text-align: center;
        padding: 24px;
        max-width: 320px;
      }
      .boot-error h1 {
        font-size: 20px;
      }
      .boot-error p {
        color: #cfe6ee;
        font-size: 13px;
        line-height: 1.5;
      }
      .boot-error button {
        margin-top: 12px;
        padding: 12px 22px;
        border-radius: 16px;
        border: 0;
        background: #ffd76a;
        color: #2b2412;
        font-weight: 700;
        font-size: 15px;
      }
      @keyframes bootPulse {
        0%,
        100% {
          opacity: 0.35;
          transform: scaleX(0.82);
        }
        50% {
          opacity: 1;
          transform: scaleX(1);
        }
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <div id="boot-splash">
      <div class="boot-logo"><span class="boot-palm">⌇</span>Islands</div>
      <div class="boot-sub">строй · развивай · открывай</div>
      <div class="boot-wave"></div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
